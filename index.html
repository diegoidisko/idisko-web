<style>/* iDisko Design System — Colors & Type Tokens
 * Lifted directly from idisko-app-web/src/style/css/app.css
 */

@font-face {
  font-family: "ClashDisplay";
  src: url("assets/ClashDisplay.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  /* ── Brand RGBs (for alpha compositing in shadows/glows) ───────── */
  --brand-primary-rgb: 135, 55, 220;   /* #8737DC  violet */
  --brand-secondary-rgb: 223, 7, 255;  /* #DF07FF  magenta */
  --status-success-rgb: 34, 255, 189;  /* #22FFBD  on-air green (LIVE) */
  --status-online-rgb:  61, 220, 151;  /* #3DDC97  online success      */
  --status-shuffle-rgb: 255, 122, 26;  /* #FF7A1A  shuffle orange      */

  /* ── Brand Colors ──────────────────────────────────────────────── */
  --brand-primary: rgb(var(--brand-primary-rgb));
  --brand-secondary: rgb(var(--brand-secondary-rgb));
  --brand-tertiary: #3b0283;

  /* ── Surfaces (dark-first) ─────────────────────────────────────── */
  --bg: #000214;             /* app base */
  --bg-dark: #0a0a1e;
  --bg-surface: #0e0d1f;
  --bg-subdued: #09091b;
  --bg-light: #5d4e73;       /* "Input background" 25% tinted uses this */
  --bg-input: rgba(93, 78, 115, 0.25);

  /* ── Neutral ramp (text / borders / chrome) ────────────────────── */
  --neutral-50:  #ffffff;
  --neutral-100: rgba(255, 255, 255, 0.7);
  --neutral-300: #e0e0e0;
  --neutral-400: #b5b3bd;
  --neutral-500: #9e9e9e;
  --neutral-600: #666672;
  --neutral-700: #5d4e73;
  --neutral-800: #2d2933;
  --neutral-900: #101123;

  /* ── Status ────────────────────────────────────────────────────── */
  --status-live:    rgb(var(--status-success-rgb));    /* #22FFBD on-air green */
  --status-success: rgb(var(--status-success-rgb));    /* alias for LIVE / on-air */
  --status-online:  rgb(var(--status-online-rgb));     /* #3DDC97 presence */
  --status-shuffle: rgb(var(--status-shuffle-rgb));    /* #FF7A1A shuffle */
  --status-vip:     var(--brand-secondary);            /* #DF07FF */
  --status-danger:  #ff4d4f;                           /* error / destructive */
  --status-error:   #ff4d4f;

  /* ── Gradients (brand signature) ───────────────────────────────── */
  --gradient-primary: linear-gradient(
    128.46deg,
    var(--brand-secondary) 30.32%,
    var(--brand-secondary) 30.32%,
    var(--brand-primary) 59.37%
  );
  --gradient-tile: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
  --gradient-disko: radial-gradient(ellipse at 50% 0%, #2a0d4a 0%, #0a0a1e 55%, #000214 100%);

  /* ── Glow shadows ──────────────────────────────────────────────── */
  --shadow-primary-soft:  0 4px 200px rgba(var(--brand-primary-rgb), 0.3);
  --shadow-primary-modal: 0 4px 250px rgba(var(--brand-primary-rgb), 0.4);
  --shadow-secondary-btn: 0 4px  50px rgba(var(--brand-secondary-rgb), 0.25);
  --shadow-card:          0 8px  24px rgba(0, 0, 0, 0.45);

  /* ── Semantic text / foreground ────────────────────────────────── */
  --fg-1: var(--neutral-50);                /* primary on dark */
  --fg-2: var(--neutral-100);               /* secondary on dark */
  --fg-3: var(--neutral-400);               /* tertiary / placeholder */
  --fg-muted: var(--neutral-600);
  --fg-on-brand: var(--neutral-50);
  --placeholder: var(--neutral-400);

  /* ── Radii ─────────────────────────────────────────────────────── */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  /* ── Spacing (4pt) ─────────────────────────────────────────────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;

  /* ── Type family ───────────────────────────────────────────────── */
  --font-display: "ClashDisplay", "Space Grotesk", system-ui, sans-serif;
  --font-body:    "ClashDisplay", "Inter", system-ui, sans-serif;
  --font-ui:      "ClashDisplay", "Inter", system-ui, sans-serif;

  /* ── Type scale (mobile-first; display sizes for marketing hero) ─ */
  --text-xs:   10px;
  --text-sm:   12px;
  --text-md:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  30px;
  --text-4xl:  40px;
  --text-5xl:  56px;
  --text-6xl:  72px;
  --text-hero: 100px;

  /* ── Weights ───────────────────────────────────────────────────── */
  --w-light: 300;
  --w-regular: 400;
  --w-medium: 500;
  --w-semibold: 600;
  --w-bold: 700;

  /* ── Transitions ───────────────────────────────────────────────── */
  --t-fast: 150ms cubic-bezier(.2,.8,.2,1);
  --t-med:  250ms cubic-bezier(.2,.8,.2,1);
  --t-slow: 400ms cubic-bezier(.2,.8,.2,1);
}

/* ─────────────────────────────────────────────────────────────────
 *  Semantic type roles
 * ─────────────────────────────────────────────────────────────── */
html, body {
  background: var(--bg);
  color: var(--fg-1);
  font-family: var(--font-body);
  font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.h-display {
  font-family: var(--font-display);

}
.h1 {
  font-family: var(--font-display);
  font-weight: var(--w-bold);
  font-size: var(--text-5xl);
  line-height: 1.02;
  letter-spacing: -0.02em;
}
.h2 {
  font-family: var(--font-display);
  font-weight: var(--w-semibold);
  font-size: var(--text-4xl);
  line-height: 1.05;
  letter-spacing: -0.015em;
}
.h3 {
  font-family: var(--font-display);
  font-weight: var(--w-semibold);
  font-size: var(--text-3xl);
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.h4 {
  font-family: var(--font-display);
  font-weight: var(--w-semibold);
  font-size: var(--text-2xl);
  line-height: 1.2;
}
.p, p {
  font-family: var(--font-body);
  font-weight: var(--w-regular);
  font-size: var(--text-base);

  color: var(--fg-2);
}
.p-lg {
  font-size: var(--text-lg);
  line-height: 1.55;
}
.caption {
  font-family: var(--font-ui);
  font-weight: var(--w-medium);
  font-size: var(--text-sm);
  color: var(--fg-3);
  line-height: 1.4;
}
.eyebrow {
  font-family: var(--font-ui);
  font-weight: var(--w-semibold);
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--brand-secondary);
}
.label-btn {
  font-family: var(--font-ui);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.text-gradient {
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

r ora.","body":"Niente carta. Niente download. Chiudi la scheda quando vuoi.","cta":"Apri iDisko →"},"faq":{"eyebrow":"Domande","title":"Risposte dirette.","q1":"iDisko è gratis?","a1":"Sì. L'esperienza di base è gratis — per sempre. iDisko Premium (4,99 €/mese) toglie le pub, sblocca stanze VIP illimitate, status custom e filtri avanzati. Non ti serve per sentire la magia.","q2":"Devo mostrare la camera?","a2":"Mai. La maggior parte non lo fa. La presenza audio (una piccola barra EQ che si muove quando suona la tua musica) basta a sapere che c'è qualcuno. Le camere sono spente di default — puoi restare invisibile dietro solo una foto profilo.","q3":"È come un'app di incontri?","a3":"Non esattamente. iDisko serve a conoscere persone attraverso quello che stai ascoltando ora — non a swipare su profili. Alcuni fanno amicizia, altri trovano un appuntamento, altri vogliono solo compagnia mentre cucinano. L'app non spinge nessuno di questi usi.","q4":"Quali fonti musicali supporta?","a4":"YouTube e Jamendo (royalty-free). Più integrazioni in arrivo.","q5":"È privato?","a5":"Le stanze non si registrano. Il tuo viso (se lo attivi) non viene memorizzato. La moderazione IA tiene fuori falsi e creep. Shuffle è opt-in — accetti o salti ogni match.","q6":"In cosa è diverso da Discord o dalle app di incontri?","a6":"Discord è costruito attorno ai canali vocali e alla chat. Le app di incontri sono costruite attorno a foto e bio. iDisko è costruito attorno alla canzone che suona nelle tue cuffie ora — e alle persone che ascoltano qualcosa di simile in tutto il mondo. Puoi restare qui per ore senza scrivere una parola, o mandare una richiesta e finire in una chat VIP. Decidi tu."},"finalCta":{"onlineSuffix":"ONLINE","titleLine1":"La tua prossima canzone","titleGradient":"non deve essere un assolo.","body":"Aprila in una scheda. Premi play su quello che ami. C'è un mondo intero in ascolto con te.","cta":"Provalo ora","or":"— oppure —"},"newsletter":{"eyebrow":"Newsletter","title":"S     const browser = (navigator.language || "en").slice(0,2).toLowerCase();

  }

  window.LANG_LOCALE = window.LOCALES[lang] || "en-US";
  document.documentElement.lang = lang;
})();

// Live user count — synced with backend (e.g. Supabase) when available.
// TODO(diego): replace fetch URL with real Supabase REST endpoint.
function LiveUserCount({ numberStyle = null } = {}) {
  const { t, lang } = window.useT();
  const { useState, useEffect, useRef } = React;
  const [n, setN] = useState(null);
  const [pulseKey, setPulseKey] = useState(0);
  const lastCount = useRef(n);
  const hasLoadedRealCount = useRef(false);

  useEffect(() => {
    let mounted = true;
    const ENDPOINT = window.__LIVE_COUNT_ENDPOINT || "https://api.idisko.com/functions/v1/quick-api";
    const fetchReal = async () => {
      try {
        const prefetched = window.__liveCountPromise;
        window.__liveCountPromise = null;
        const d = prefetched
          ? await prefetched
          : await fetch(ENDPOINT, { cache: "no-store" }).then(r => r.ok ? r.json() : null);
        if (!mounted || !d || typeof d.count !== "number") return;
        setN(prev => {
          if (!hasLoadedRealCount.current) {
            hasLoadedRealCount.current = true;
            return d.count;
          }
          return Math.max(prev ?? d.count, d.count);
        });
      } catch (_) {
        if (mounted && !hasLoadedRealCount.current) setN(8000);
      }
    };
    fetchReal();
    const fetchInterval = setInterval(fetchReal, 30_000);
    const tickInterval = setInterval(() => {
      if (mounted) setN(v => typeof v === "number" ? v + 4 : v);
    }, 5_000);
    return () => {
      mounted = false;
      clearInterval(fetchInterval);
      clearInterval(tickInterval);
    };
  }, []);

  useEffect(() => {
    if (n === null || lastCount.current === n) return;
    lastCount.current = n;
    setPulseKey(k => k + 1);
  }, [n]);

  const sep = lang === "en" ? "," : ".";
  const formatted = n === null ? "..." : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  return <span><span key={pulseKey} className="live-count-number" style={numberStyle || undefined}>{formatted}</span> {t('liveCount.suffix')}</span>;
}

function NewsletterForm() {
  const { t, lang } = window.useT();
  const { useState } = React;
  const [email, setEmail]     = useState("");
  const [status, setStatus]   = useState("idle"); // idle | sending | success | already | error
  const [errorMsg, setError]  = useState("");

  const API_URL = "https://api.idisko.com/functions/v1/newsletter-api?action=subscribe";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  const onSubmit = async (e) => {
    e.preventDefault();
    if (status === "sending") return;
    const v = email.trim();
    if (!EMAIL_RE.test(v)) { setStatus("error"); setError(t('newsletter.invalidEmail')); return; }
    setStatus("sending"); setError("");
    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: v, locale: lang, source: "landing" }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (d && d.error === "email_invalid") { setStatus("error"); setError(t('newsletter.invalidEmail')); return; }
        setStatus("error"); setError(t('newsletter.networkError')); return;
      }
      if (d.status === "already_confirmed") setStatus("already");
      else                                  setStatus("success");

      // ── Conversion tracking (Klaro-gated; safe to call even without consent) ──
      try {
        const emailDomain = v.split("@")[1] || "";
        if (window.idisko && typeof window.idisko.track === "function") {
          window.idisko.track("newsletter_signup", {
            email_domain: emailDomain,
            locale: lang,
            already_confirmed: d.status === "already_confirmed",
            source: "landing"
          });
        }
      } catch (_) {}
    } catch (_) {
      setStatus("error"); setError(t('newsletter.networkError'));
    }
  };

  const showSuccess = status === "success";
  const showAlready = status === "already";
  const sending     = status === "sending";

  return (
    <section id="newsletter" className="section-pad" style={{padding:"40px 0 60px"}}>
      <div className="container" style={{maxWidth:720}}>
        <div style={{position:"relative",padding:"40px 32px",borderRadius:24,background:"linear-gradient(180deg,rgba(14,13,31,0.7),rgba(9,9,27,0.95))",border:"1px solid rgba(135,55,220,0.25)",boxShadow:"0 20px 60px rgba(0,0,0,.4), 0 0 80px rgba(223,7,255,.08)",textAlign:"center",overflow:"hidden"}}>
          <div style={{position:"absolute",inset:"-30% -10%",background:"radial-gradient(ellipse at 50% 0%,rgba(223,7,255,.18) 0%,transparent 60%)",pointerEvents:"none"}}/>
          <div style={{position:"relative"}}>
            <div className="eyebrow" style={{fontSize:11,fontWeight:700,letterSpacing:".18em",textTransform:"uppercase",color:"#DF07FF",marginBottom:14}}>{t('newsletter.eyebrow')}</div>
            <h2 style={{fontFamily:"ClashDisplay",fontWeight:600,fontSize:36,letterSpacing:"-0.02em",lineHeight:1.05,margin:0,textWrap:"balance"}}>
              {t('newsletter.title')}
            </h2>
            <p style={{fontSize:15,color:"#b5b3bd",marginTop:14,lineHeight:1.55,maxWidth:480,marginLeft:"auto",marginRight:"auto",textWrap:"pretty"}}>
              {t('newsletter.body')}
            </p>

            {showSuccess || showAlready ? (
              <div role="status" aria-live="polite" style={{marginTop:28,padding:"22px 24px",borderRadius:16,background:"rgba(34,255,189,.08)",border:"1px solid rgba(34,255,189,.3)"}}>
                <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:42,height:42,borderRadius:"50%",background:"rgba(34,255,189,.15)",border:"1px solid rgba(34,255,189,.4)",marginBottom:12}}>
                  <i data-lucide="check" style={{width:20,height:20,color:"#22FFBD"}}/>
                </div>
                <div style={{fontFamily:"ClashDisplay",fontWeight:600,fontSize:18,color:"#fff",marginBottom:6}}>
                  {showAlready ? t('newsletter.alreadyConfirmed') : t('newsletter.successTitle')}
                </div>
                {showSuccess && (
                  <div style={{fontSize:14,color:"#b5b3bd",lineHeight:1.5}}>{t('newsletter.successBody')}</div>
                )}
              </div>
            ) : (
              <form onSubmit={onSubmit} noValidate style={{marginTop:28,display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
                <div style={{display:"flex",gap:10,width:"100%",maxWidth:480,flexWrap:"wrap",justifyContent:"center"}}>
                  <input
                    type="email"
                    inputMode="email"
                    autoComplete="email"
                    required
                    value={email}
                    onChange={e=>{ setEmail(e.target.value); if (status==="error") setStatus("idle"); }}
                    placeholder={t('newsletter.placeholder')}
                    aria-label={t('newsletter.placeholder')}
                    aria-invalid={status==="error"}
                    style={{flex:"1 1 240px",minWidth:0,padding:"14px 18px",borderRadius:999,background:"rgba(93,78,115,0.18)",border:`1px solid ${status==="error"?"#ff4d4f":"#2d2933"}`,color:"#fff",fontSize:15,outline:"none",transition:"border-color 150ms"}}
                    onFocus={e=>{ if(status!=="error") e.currentTarget.style.borderColor="#8737DC"; }}
                    onBlur={e=>{ if(status!=="error") e.currentTarget.style.borderColor="#2d2933"; }}
                    disabled={sending}
                  />
                  <button
                    type="submit"
                    disabled={sending}
                    data-event="newsletter_subscribe"
                    data-posthog="newsletter_submit"
                    style={{padding:"14px 24px",borderRadius:999,background:"linear-gradient(128deg,#DF07FF 10%,#8737DC 70%)",color:"#fff",fontWeight:700,fontSize:14,letterSpacing:".02em",border:"none",cursor:sending?"wait":"pointer",boxShadow:"0 6px 24px rgba(223,7,255,.3)",transition:"transform 150ms",opacity:sending?0.7:1,whiteSpace:"nowrap"}}
                    onMouseDown={e=>e.currentTarget.style.transform="scale(.97)"}
                    onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}
                    onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
                    {sending ? t('newsletter.sending') : t('newsletter.cta')}
                  </button>
                </div>
                {status === "error" && (
                  <div role="alert" style={{fontSize:13,color:"#ff4d4f",marginTop:2}}>{errorMsg}</div>
                )}
                <div style={{fontSize:12,color:"#666672",marginTop:6}}>
                  {t('newsletter.consent')} <a href="/politique-de-confidentialite/" style={{color:"#b5b3bd",textDecoration:"underline"}}>{t('newsletter.consentLink')}</a>.
                </div>
              </form>
            )}

}

<script type="text/babel">
const { useEffect, useState, useContext, createContext, useMemo } = React;

// ─── i18n context ─────────────────────────────────────────────────────────
// Expose globally so components defined in other <script type="text/babel"> blocks
// (Header, Hero, Footer, etc.) can access the same Context instance.
const LangContext = createContext({ lang: "en", setLang: () => {}, t: (k) => k });
window.LangContext = LangContext;

// Global useT: works across all babel script blocks.
window.useT = function useT() { return React.useContext(window.LangContext); };
function useT() { return window.useT(); }

// Helper: dotted key lookup with fallback chain (current → en → key)
function lookupT(strings, lang, key) {
  const parts = key.split(".");
  let v = strings[lang];
  for (const p of parts) { v = v && v[p]; if (v == null) break; }
  if (v != null) return v;
  // Fallback to English
  v = strings["en"];
  for (const p of parts) { v = v && v[p]; if (v == null) break; }
  return v != null ? v : key;
}

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAKS);
  const [lang, setLangState] = useState(window.LANG || "en");
  const setLang = (newLang) => {
    if (window.SUPPORTED_LANGS && window.SUPPORTED_LANGS.indexOf(newLang) === -1) return;
    window.LANG = newLang;
    window.LANG_LOCALE = (window.LOCALES && window.LOCALES[newLang]) || "en-US";
    document.documentElement.lang = newLang;
    try { localStorage.setItem("idisko_lang", newLang); } catch(e) {}
    setLangState(newLang);
  };
  const langCtx = useMemo(() => ({
    lang,
    setLang,
    t: (key) => lookupT(window.STRINGS, lang, key),
  }), [lang]);

  useEffect(() => {
    const tick = () => window.lucide && window.lucide.createIcons();
    tick();
    const t = setInterval(tick, 400);
    return () => clearInterval(t);
  }, [tweaks, lang]);

  // Tweaks bridge
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setShowTweaks(true);
      if (d.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const [showTweaks, setShowTweaks] = useState(false);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.__TWEAKS = next;
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]: v}}, '*');
  };

  return (
    <LangContext.Provider value={langCtx}>
    <div data-accent={tweaks.accentHue}>
      <Header/>
      <Hero tweaks={tweaks}/>
      <SocialProof tweaks={tweaks}/>
      <Testimonials/>
      <ProblemSolution/>
      <HowItWorks/>
      <FeatureShowcase/>
      <UseCases/>
      <LifestyleGallery/>
      <PricingHint/>
      <Faq/>
      <FinalCta/>
      <SocialFollow/>
      <Footer/>
      {showTweaks && <TweaksPanel tweaks={tweaks} setTweak={setTweak} onClose={()=>setShowTweaks(false)}/>}
    </div>
    </LangContext.Provider>
  );
}

function TweaksPanel({ tweaks, setTweak, onClose }) {
  return (
    <div id="tweaks-panel">
      <div className="tw-title">
        Tweaks
        <button className="tw-close" onClick={onClose}>✕</button>
      </div>
      <div className="tw-row">
        <label>Accent</label>
        <select value={tweaks.accentHue} onChange={e=>setTweak('accentHue', e.target.value)}>
          <option value="violet">Violet + Magenta</option>
          <option value="mint">Warm Mint</option>
          <option value="amber">Cozy Amber</option>
        </select>
      </div>
      <div className="tw-row">
        <label>Hero visual</label>
        <select value={tweaks.heroStyle} onChange={e=>setTweak('heroStyle', e.target.value)}>
          <option value="tiles">Floating tiles</option>
          <option value="desk">Cozy desk</option>
          <option value="record">Vinyl + tiles</option>
        </select>
      </div>
      <div className="tw-row">
        <label>Avatars</label>
        <select value={String(tweaks.showAvatars)} onChange={e=>setTweak('showAvatars', e.target.value === 'true')}>
          <option value="true">Show</option>
          <option value="false">Hide</option>
        </select>
      </div>
      <div className="tw-row">
        <label>Copy tone</label>
        <select value={tweaks.copyVariant} onChange={e=>setTweak('copyVariant', e.target.value)}>
          <option value="poetic">Poetic</option>
          <option value="direct">Direct</option>
          <option value="playful">Playful</option>
        </select>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

// ── Delegated CTA tracking (Klaro-gated via window.idisko.track) ─────────
// Any clickable element with `data-event="..."` automatically reports to
// PostHog, Meta Pixel and Clarity. Optional `data-meta="EventName"` overrides
// the Meta standard event name (else mapped via stdMap in klaro-trackers.js).
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-event]");
  if (!el) return;
  var eventName = el.getAttribute("data-event");
  if (!eventName) return;
  try {
    if (window.idisko && typeof window.idisko.track === "function") {
      var props = {
        href: el.getAttribute("href") || null,
        text: (el.textContent || "").trim().slice(0, 80),
        meta_event: el.getAttribute("data-meta") || null,
        posthog_event: el.getAttribute("data-posthog") || null
      };
      window.idisko.track(eventName, props);
    }
  } catch (_) {}
}, true);
</script>
