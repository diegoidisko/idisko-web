// Live user count — synced with backend (e.g. Supabase) when available.
// TODO(diego): replace fetch URL with real Supabase REST endpoint.
function LiveUserCount() {
  const { useState, useEffect, useRef } = React;
  const [n, setN] = useState(8456); // last known seed; replaced by real fetch within ~1s
  const realRef = useRef(8456);

  useEffect(() => {
    let mounted = true;
    const ENDPOINT = "https://api.idisko.com/functions/v1/quick-api";

    // Fetch the real number from PostHog (via Supabase edge function proxy)
    const fetchReal = async () => {
      try {
        const r = await fetch(ENDPOINT, { cache: "no-store" });
        if (!r.ok) return;
        const d = await r.json();
        if (!mounted || typeof d.count !== "number") return;
        realRef.current = d.count;
        // Snap to truth: if we drifted >5 above the real, jump down; otherwise set to real.
        setN(prev => Math.abs(prev - d.count) > 5 ? d.count : d.count);
      } catch (_) { /* keep last value */ }
    };
    fetchReal();
    const realInterval = setInterval(fetchReal, 30_000); // 30s

    // "Felt-alive" tick: every ~3.5s, sometimes +1 (never more than +3 above real)
    const tickInterval = setInterval(() => {
      if (!mounted) return;
      setN(v => {
        if (Math.random() < 0.4 && v < realRef.current + 3) return v + 1;
        return v;
      });
    }, 3500);

    return () => { mounted = false; clearInterval(realInterval); clearInterval(tickInterval); };
  }, []);

  return <span>{n.toLocaleString("en-US")} people on iDisko</span>;
}

<script type="text/babel">
const { useEffect, useState } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAKS);
  useEffect(() => {
    const tick = () => window.lucide && window.lucide.createIcons();
    tick();
    const t = setInterval(tick, 400);
    return () => clearInterval(t);
  }, [tweaks]);

  // Tweaks bridge
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setShowTweaks(true);
      if (d.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const [showTweaks, setShowTweaks] = useState(false);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.__TWEAKS = next;
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]: v}}, '*');
  };

  return (
    <div data-accent={tweaks.accentHue}>
      <Header/>
      <Hero tweaks={tweaks}/>
      <SocialProof tweaks={tweaks}/>
      <ProblemSolution/>
      <HowItWorks/>
      <FeatureShowcase/>
      <UseCases/>
      <Testimonials/>
      <PricingHint/>
      <Faq/>
      <FinalCta/>
      <Footer/>
      {showTweaks && <TweaksPanel tweaks={tweaks} setTweak={setTweak} onClose={()=>setShowTweaks(false)}/>}
    </div>
  );
}

function TweaksPanel({ tweaks, setTweak, onClose }) {
  return (
    <div id="tweaks-panel">

          <option value="amber">Cozy Amber</option>

          <option value="desk">Cozy desk</option>
          <option value="record">Vinyl + tiles</option>
        </select>
      </div>
      <div className="tw-row">
        <label>Avatars</label>
        <select value={String(tweaks.showAvatars)} onChange={e=>setTweak('showAvatars', e.target.value === 'true')}>
          <option value="true">Show</option>
          <option value="false">Hide</option>
        </select>
      </div>
      <div className="tw-row">
        <label>Copy tone</label>
        <select value={tweaks.copyVariant} onChange={e=>setTweak('copyVariant', e.target.value)}>
          <option value="poetic">Poetic</option>
          <option value="direct">Direct</option>
          <option value="playful">Playful</option>
        </select>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>


</body></html>
