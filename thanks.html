<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000214" />
<title>You're in — iDisko</title>
<meta name="description" content="Thanks for confirming your iDisko subscription." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/logo.png" />

<!-- Smart App Banner (iOS Safari only) -->
<meta name="apple-itunes-app" content="app-id=6749269410, app-argument=https://www.idisko.com/" />

<link rel="canonical" href="https://www.idisko.com/thanks.html" />
<meta name="robots" content="noindex,follow" />

<!-- Open Graph & Twitter -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="iDisko" />
<meta property="og:url" content="https://www.idisko.com/thanks.html" />
<meta property="og:title" content="iDisko — Thanks!" />
<meta property="og:description" content="Thanks for subscribing to iDisko Inside. Check your email to confirm." />
<meta property="og:image" content="https://www.idisko.com/assets/og-cover.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://www.idisko.com/assets/og-cover.png" />

<style>
@font-face {
  font-family: "ClashDisplay";
  src: url("assets/ClashDisplay.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #000214;
  --bg-surface: #0e0d1f;
  --fg-1: #ffffff;
  --fg-2: #e0e0e0;
  --fg-3: #b5b3bd;
  --fg-muted: #666672;
  --line: #1a1632;
  --brand-primary: #8737DC;
  --brand-secondary: #DF07FF;
  --status-success: #22FFBD;
  --gradient-primary: linear-gradient(128deg, #DF07FF 10%, #8737DC 70%);
  --font-display: "ClashDisplay", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg-1);
  font-family: var(--font-display);
  min-height: 100vh;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(135,55,220,.32), transparent 60%),
    radial-gradient(ellipse 45% 35% at 90% 30%, rgba(223,7,255,.18), transparent 60%),
    radial-gradient(ellipse 45% 35% at 10% 70%, rgba(34,255,189,.10), transparent 60%);
}
a { color: var(--brand-secondary); text-decoration: none; transition: color .15s; }
a:hover { color: #fff; }

.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(0,2,20,.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(135,55,220,.12);
  padding: 14px 0;
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.logo-link {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--fg-1);
  font-weight: 700; font-size: 18px; letter-spacing: -0.02em;
}
.logo-link img { height: 26px; }
.lang-switch {
  display: inline-flex; gap: 4px;
  background: rgba(93,78,115,.18);
  border: 1px solid var(--line);
  border-radius: 999px; padding: 4px;
}
.lang-btn {
  padding: 4px 10px; border-radius: 999px;
  background: transparent; color: var(--fg-3);
  border: none; cursor: pointer; font-size: 12px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  font-family: var(--font-display);
  transition: all .15s;
}
.lang-btn:hover { color: var(--fg-1); }
.lang-btn.active { background: var(--gradient-primary); color: #fff; }

main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
}
.card {
  width: 100%; max-width: 620px;
  background: linear-gradient(180deg, rgba(14,13,31,.7), rgba(9,9,27,.95));
  border: 1px solid rgba(135,55,220,.3);
  border-radius: 28px;
  padding: 56px 40px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 100px rgba(135,55,220,.15);
}
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(34,255,189,.12);
  border: 1px solid rgba(34,255,189,.4);
  color: var(--status-success);
  font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  margin-bottom: 26px;
}
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--status-success);
  box-shadow: 0 0 10px var(--status-success);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.85); }
}

.title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 48px; letter-spacing: -0.02em; line-height: 1.0;
  margin: 0 0 18px;
  text-wrap: balance;
}
.title .grad {
  background: linear-gradient(128deg, #DF07FF, #8737DC);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.body {
  font-size: 17px; color: var(--fg-3); line-height: 1.6;
  margin: 0 0 36px;
  max-width: 460px;
  margin-left: auto; margin-right: auto;
  text-wrap: pretty;
}

.cta-row {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 32px; border-radius: 999px;
  background: var(--gradient-primary);
  color: #fff; font-weight: 700; font-size: 16px;
  text-decoration: none;
  box-shadow: 0 10px 40px rgba(223,7,255,.4);
  transition: transform .15s;
}
.cta:hover { color: #fff; transform: translateY(-1px); }
.cta:active { transform: scale(.97); }
.cta .play-circle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,.18);
}
.cta .play-circle svg { width: 13px; height: 13px; }

.or { font-size: 12px; color: var(--fg-muted); }

.stores {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
}
.store {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
  color: var(--fg-1);
  text-decoration: none;
  transition: all .15s;
}
.store:hover { background: rgba(255,255,255,.08); border-color: rgba(135,55,220,.5); color: var(--fg-1); }
.store-cap { font-size: 9px; color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; line-height: 1; margin-bottom: 3px; }
.store-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1; }

footer.foot {
  padding: 24px 32px; text-align: center;
  font-size: 12px; color: var(--fg-muted);
  border-top: 1px solid var(--line);
  background: var(--bg-surface);
}
</style>

<!-- Klaro consent manager -->
<link rel="stylesheet" href="assets/klaro.min.css" />
<script defer src="assets/klaro-config.js"></script>
<script defer src="assets/klaro.no-css.js"></script>
<script defer src="assets/klaro-trackers.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo-link" href="index.html">
      <img src="assets/logo.png" alt="iDisko" />
      <span>iDisko</span>
    </a>
    <div class="lang-switch" id="langSwitch" role="tablist" aria-label="Language"></div>
  </div>
</nav>

<main>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span id="badgeText">CONFIRMED</span>
    </div>
    <h1 class="title">
      <span id="titleLine1">You're in.</span><br>
      <span class="grad" id="titleLine2">The music is already playing.</span>
    </h1>
    <p class="body" id="bodyText">…</p>

    <div class="cta-row">
      <a class="cta" id="ctaBtn" href="https://app.idisko.com" data-event="thanks_open_app" data-posthog="thanks_open_app">
        <span class="play-circle">
          <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </span>
        <span id="ctaText">Open iDisko</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <div class="or" id="orText">— or —</div>
      <div class="stores">
        <a class="store" id="appStoreLink" href="https://apps.apple.com/fr/app/idisko/id6749269410" target="_blank" rel="noopener noreferrer" data-event="thanks_appstore">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          <span>
            <span class="store-cap" id="appStoreCap">Download on the</span>
            <span class="store-label">App Store</span>
          </span>
        </a>
        <a class="store" id="googlePlayLink" href="https://play.google.com/store/apps/details?id=com.idisko.app" target="_blank" rel="noopener noreferrer" data-event="thanks_googleplay">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#34A853" d="M3 20.5V3.5c0-.27.16-.5.4-.6L13.7 12 3.4 21.1c-.24-.1-.4-.33-.4-.6z"/>
            <path fill="#FBBC04" d="M16.5 14.7l-2.8-2.7 2.8-2.8 3.4 1.96c.94.54.94 1.88 0 2.42l-3.4 1.13z"/>
            <path fill="#EA4335" d="M3.4 21.1L13.7 12l2.8 2.7-12.7 6.5c-.13-.07-.27-.13-.4-.1z"/>
            <path fill="#4285F4" d="M3.4 2.9L16.5 9.2 13.7 12 3.4 2.9z"/>
          </svg>
          <span>
            <span class="store-cap" id="googlePlayCap">Get it on</span>
            <span class="store-label">Google Play</span>
          </span>
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="foot">
  <span id="footCopyright">© 2026 iDisko.</span>
</footer>

<script>
(function(){
  var SUPPORTED = ["es","en","fr","it","pt"];
  var I18N = {
    es: {
      langName: "ES",
      badge: "CONFIRMADO",
      titleLine1: "Estás adentro.",
      titleLine2: "La música ya está sonando.",
      body: "Te vamos a escribir solo cuando haya algo bueno —betas, features grandes, novedades reales. Mientras tanto, abrí la web app y caé en una sala llena de gente.",
      cta: "Abrir iDisko",
      or: "— o —",
      appStoreCap: "Descargá en el",
      googlePlayCap: "Bajalo en",
      copyright: "© 2026 iDisko. La primera app social impulsada por la música."
    },
    en: {
      langName: "EN",
      badge: "CONFIRMED",
      titleLine1: "You're in.",
      titleLine2: "The music is already playing.",
      body: "We'll only write when something good ships — beta launches, real updates, never spam. In the meantime, open the web app and land in a room full of people.",
      cta: "Open iDisko",
      or: "— or —",
      appStoreCap: "Download on the",
      googlePlayCap: "Get it on",
      copyright: "© 2026 iDisko. The first social app powered by music."
    },
    fr: {
      langName: "FR",
      badge: "CONFIRMÉ",
      titleLine1: "Tu es dans la place.",
      titleLine2: "La musique tourne déjà.",
      body: "On n'écrira que quand quelque chose de bon arrive — betas, vraies nouveautés, jamais de spam. En attendant, ouvre la web app et atterris dans un salon plein de monde.",
      cta: "Ouvrir iDisko",
      or: "— ou —",
      appStoreCap: "Télécharger sur",
      googlePlayCap: "Disponible sur",
      copyright: "© 2026 iDisko. La première app sociale propulsée par la musique."
    },
    it: {
      langName: "IT",
      badge: "CONFERMATO",
      titleLine1: "Sei dentro.",
      titleLine2: "La musica sta già suonando.",
      body: "Scriveremo solo quando c'è qualcosa di buono — beta, novità vere, mai spam. Nel frattempo, apri la web app e atterra in una stanza piena di gente.",
      cta: "Apri iDisko",
      or: "— oppure —",
      appStoreCap: "Scarica su",
      googlePlayCap: "Scaricalo su",
      copyright: "© 2026 iDisko. La prima app sociale alimentata dalla musica."
    },
    pt: {
      langName: "PT",
      badge: "CONFIRMADO",
      titleLine1: "Você tá dentro.",
      titleLine2: "A música já tá tocando.",
      body: "Só vamos escrever quando rolar algo bom — betas, novidades de verdade, zero spam. Enquanto isso, abre o web app e cai numa sala cheia de gente.",
      cta: "Abrir iDisko",
      or: "— ou —",
      appStoreCap: "Baixe na",
      googlePlayCap: "Disponível no",
      copyright: "© 2026 iDisko. O primeiro app social movido a música."
    }
  };

  function detectLang() {
    var qs = new URLSearchParams(location.search);
    var fromQs = qs.get("lang");
    if (fromQs && SUPPORTED.indexOf(fromQs) !== -1) return fromQs;
    try {
      var stored = localStorage.getItem("idisko_lang");
      if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
    } catch (e) {}
    var browser = (navigator.language || "en").slice(0,2).toLowerCase();
    return SUPPORTED.indexOf(browser) !== -1 ? browser : "en";
  }

  function setLang(lang) {
    if (SUPPORTED.indexOf(lang) === -1) lang = "en";
    document.documentElement.lang = lang;
    try { localStorage.setItem("idisko_lang", lang); } catch (e) {}
    var t = I18N[lang];
    document.getElementById("badgeText").textContent     = t.badge;
    document.getElementById("titleLine1").textContent    = t.titleLine1;
    document.getElementById("titleLine2").textContent    = t.titleLine2;
    document.getElementById("bodyText").textContent      = t.body;
    document.getElementById("ctaText").textContent       = t.cta;
    document.getElementById("orText").textContent        = t.or;
    document.getElementById("appStoreCap").textContent   = t.appStoreCap;
    document.getElementById("googlePlayCap").textContent = t.googlePlayCap;
    document.getElementById("footCopyright").textContent = t.copyright;
    renderLangSwitch(lang);
  }

  function renderLangSwitch(active) {
    var wrap = document.getElementById("langSwitch");
    wrap.innerHTML = "";
    SUPPORTED.forEach(function(l){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lang-btn" + (l === active ? " active" : "");
      b.textContent = I18N[l].langName;
      b.setAttribute("aria-pressed", l === active ? "true" : "false");
      b.addEventListener("click", function(){ setLang(l); });
      wrap.appendChild(b);
    });
  }

  setLang(detectLang());
})();
</script>

</body>
</html>
